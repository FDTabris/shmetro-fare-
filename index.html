<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>上海地铁调价方案对比</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="welcomeModal" class="welcome-modal hidden" role="dialog" aria-modal="true" aria-labelledby="welcomeModalTitle">
      <div class="welcome-modal__backdrop" aria-hidden="true"></div>
      <div class="welcome-modal__panel" tabindex="-1">
        <h2 id="welcomeModalTitle">说明与提醒</h2>
        <p>
          里程数据完全来自维基百科，与官方数据必然存在误差；另外，上海地铁存在一些不按照一般计价规则收费的特殊优惠区间，比如莘庄到人民广场里程超过17公里，但按照16公里以下定价¥4。故本应用数据并不保证完全准确，仅供参考，谢谢理解。
        </p>
        <button id="dismissWelcomeBtn" type="button">知道了</button>
      </div>
    </div>

    <main class="container">
      <h1>上海地铁调价方案对比</h1>

      <section class="controls">
        <div class="input-group">
          <label for="startInput">起点</label>
          <div class="autocomplete-wrap">
            <input id="startInput" autocomplete="off" placeholder="输入或选择站名" />
            <ul id="startSuggestions" class="suggestions hidden" role="listbox" aria-label="起点候选站名"></ul>
          </div>
        </div>
        <div class="input-group">
          <label for="endInput">终点</label>
          <div class="autocomplete-wrap">
            <input id="endInput" autocomplete="off" placeholder="输入或选择站名" />
            <ul id="endSuggestions" class="suggestions hidden" role="listbox" aria-label="终点候选站名"></ul>
          </div>
        </div>
        <button id="searchBtn" type="button">查询票价及路径</button>
      </section>

      <section id="result" class="result">正在加载数据…</section>

      <section id="chartPanel" class="chart-panel hidden">
        <div class="chart-toolbar">
          <h2>自然月累计支出</h2>
          <button id="passOptimizationToggle" class="secondary" type="button" aria-pressed="false">
            使用次卡省钱
          </button>
        </div>
        <svg id="fareChart" width="720" height="960" aria-label="累计支出折线图"></svg>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="./app.js" type="module"></script>
  </body>
  </html>
